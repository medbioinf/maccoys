# Example config, using Redis backend as storage,  MaCcoyS queueing server and the public MaCPepDB API

prometheus_base_url = "http://localhost:9090"
work_directory = "/mnt/results/tests/results"
message_timeout = 600
# Shared worker pool size for `pipeline processing` (search_space_generation + identification +
# scoring) and `pipeline finalization` (publication + error). The per-stage `num_tasks` below are
# ignored by those two grouped commands; only used by the single-stage standalone commands.
processing_num_tasks = 3
finalization_num_tasks = 2

[search_parameters]
max_charge = 6
lower_mass_tolerance_ppm = 10
upper_mass_tolerance_ppm = 10
max_variable_modifications = 3
decoys_per_peptide = 0
score_threshold = 0.1
keep_fasta_files = true

[search_parameters.xcorr]
bin_size = 0.02
bin_offset = 0.0
use_flanking_peaks = true
minimum_intensity = 0.0
max_fragment_charge = 3
ions = [
    "B",
    "Y",
]
use_neutral_loss_ions = false

[index]
num_tasks = 1
queue_name = "index"
queue_capacity = 100
queue_url = "http://localhost:8100"

[search_space_generation]
num_tasks = 20
queue_name = "search_space_generation"
queue_capacity = 100
queue_url = "http://localhost:8100"
concurrent_searches = 64
target_url = "http://134.147.59.92"
# decoy_url = "http://
# target_lookup_url = "http://

[identification]
num_tasks = 2
queue_name = "identification"
queue_capacity = 100
queue_url = "http://localhost:8100"
threads = 16

[scoring]
num_tasks = 1
queue_name = "scoring"
queue_capacity = 100
queue_url = "http://localhost:8100"
threads = 1

[publication]
num_tasks = 1
queue_name = "publication"
queue_capacity = 100
queue_url = "http://localhost:8100"

[error]
num_tasks = 1
queue_name = "error"
queue_capacity = 100
queue_url = "http://localhost:8100"


[storage]
time_to_idle = 300
url = "redis://localhost:6380"


[queueing]
data_directory = "/mnt/results/tests/queue-state"
message_timeout = 300
reschedule_check_interval = 300
