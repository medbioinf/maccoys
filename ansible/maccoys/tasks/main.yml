---
# tasks file for maccoys

- name: Copy image
  when:
    - maccoys_action == "start"
    - hostvars[inventory_hostname]['maccoys_dockerimage_file'] is not none
  ansible.builtin.copy:
    src: "{{ hostvars[inventory_hostname]['maccoys_dockerimage_file'] }}"
    dest: "/tmp/maccoys-image-{{ maccoys_id }}-ansible.tar"

- name: Load image
  when:
    - maccoys_action == "start"
    - hostvars[inventory_hostname]['maccoys_dockerimage_file'] is not none
  community.docker.docker_image_load:
    path: "/tmp/maccoys-image-{{ maccoys_id }}-ansible.tar"

- name: Delete image file
  when:
    - maccoys_action == "start"
    - hostvars[inventory_hostname]['maccoys_dockerimage_file'] is not none
  community.docker.docker_image_load:
    path: "/tmp/maccoys-image-{{ maccoys_id }}-ansible.tar"

- name: Pull image
  when:
    - maccoys_action == "start"
    - hostvars[inventory_hostname]['maccoys_dockerimage_file'] is none
  community.docker.docker_image_pull:
    name: ghcr.io/medbioinf/maccoys
    tag: dev
    pull: always

- name: Copy MaCcoyS config
  when: maccoys_action == "start"
  ansible.builtin.copy:
    src: ./maccoys.toml
    dest: "{{ config_file }}"
    mode: '644'
    force: true

- name: Set storage server
  when: maccoys_action == "start"
  ansible.builtin.replace:
    path: "{{ config_file }}"
    regexp: '<STORAGE_SERVER>'
    replace: "{{ groups['storage'][0] }}"

- name: Set queue server
  when: maccoys_action == "start"
  ansible.builtin.replace:
    path: "{{ config_file }}"
    regexp: '<QUEUE_SERVER>'
    replace: "{{ groups['queue'][0] }}"

- name: Set target peptide URL
  when: maccoys_action == "start"
  ansible.builtin.replace:
    path: "{{ config_file }}"
    regexp: '<TARGET_PEPTIDE_URL>'
    replace: "{{ hostvars[inventory_hostname]['maccoys_target_peptide_url'] }}"

- name: Create log directory
  when: maccoys_action == "start"
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '755'

- name: Check if container exists
  community.docker.docker_container_info:
    name: maccoys-{{ maccoys_id }}
  register: container_info
  ignore_errors: true

- name: Stopping existing container
  when: container_info.exists
  community.docker.docker_container:
    name: maccoys-{{ maccoys_id }}
    state: absent
    stop_timeout: 60

- name: Start container
  when: maccoys_action == "start"
  community.docker.docker_container:
    image: ghcr.io/medbioinf/maccoys:dev
    name: maccoys-{{ maccoys_id }}
    # auto_remove: true
    user: "{{ hostvars[inventory_hostname]['maccoys_docker_user']['uid'] }}:{{ hostvars[inventory_hostname]['maccoys_docker_user']['gid'] }}"
    volumes: "{{ volumes + (hostvars[inventory_hostname]['volumes'] | default([])) }}"
    ulimits: nofile:4096:65535
    published_ports: "{{ (ports | default([])) + ['0.0.0.0:' ~ prometheus_scraping_port|string ~ ':' ~ prometheus_scraping_port|string] }}"
    command: >
      -vv
      --terminal
      --log-file {{ log_dir }}/{{ maccoys_id }}.log
      --log-rotation  daily
      --loki http://{{ groups['monitoring'][0] }}:3100
      --prometheus 0.0.0.0:{{ prometheus_scraping_port }}
      pipeline {{ maccoys_cmd }} {{ maccoys_opts }} {{ config_file }}

- name: Remove dangling images
  when: maccoys_action == "start"
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: true
