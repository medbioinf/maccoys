prometheus_base_url = "http://localhost:9090"
work_directory = "/searches"
message_timeout = 600
# Shared worker pool size for `pipeline processing` (search_space_generation + identification +
# scoring) and `pipeline finalization` (publication + error). The per-stage `num_tasks` below are
# ignored by those two grouped commands; only used by the single-stage standalone commands.
processing_num_tasks = 1
finalization_num_tasks = 2

[index]
num_tasks = 1
queue_name = "index"
queue_capacity = 1000
queue_url = "http://<QUEUE_SERVER>:8123"

[search_space_generation]
num_tasks = 8
concurrent_searches = 256
queue_name = "search_space_generation"
queue_capacity = 100
queue_url = "http://<QUEUE_SERVER>:8123"
target_url = "<TARGET_PEPTIDE_URL>"
max_concurrent = 3
# decoy_url = "http://
# target_lookup_url = "http://

[identification]
num_tasks = 1
queue_name = "identification"
queue_capacity = 100
queue_url = "http://<QUEUE_SERVER>:8123"
threads = 16

[scoring]
num_tasks = 1
queue_name = "scoring"
queue_capacity = 100
queue_url = "http://<QUEUE_SERVER>:8123"
threads = 16

[publication]
num_tasks = 4
queue_name = "publication"
queue_capacity = 100
queue_url = "http://<QUEUE_SERVER>:8123"

[error]
num_tasks = 1
queue_name = "error"
queue_capacity = 100
queue_url = "http://<QUEUE_SERVER>:8123"


[storage]
time_to_idle = 900
url = "redis://<STORAGE_SERVER>:6379"

[queueing]
data_directory = "/queue-data"
message_timeout = 10800.0
reschedule_check_interval = 60.0
