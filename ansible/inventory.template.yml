# FOLDER_FOR_SEARCH_RESULTS Need to have the same content on all hosts,
# e.g via NFS or one server which is running all MaCcoyS components using this folder.

all:
  vars:
    maccoys_target_peptide_url: <http-or-psql-url-of-macpepdb>
    # In case you built the maccoys docker image locally, use `docker images save -o <docker-image-file-path>` to write it to disk and add the path here
    # The image file will be copied to the hosts and loaded.
    maccoys_dockerimage_file: ~
    maccoys_dockerimage: ghcr.io/medbioinf/maccoys:latest
    # User and group ID of the user who should run maccoys in the docker containers.
    maccoys_docker_user:
      uid: 1000
      gid: 1000


  children:
    # new hosts which need a base installation
    new:
      hosts:

    # ONE storage host which is exchanging data with all other hosts
    storage:
      hosts:

    # ONE monitoring host running Loki, Prometheus and Grafana
    monitoring:
      vars:
        monitoring_data_dir: <FOLDER_FOR_LOGGING>
        user: admin
        password: admin
      hosts:

    # ONE queue host running the HTTP queue server
    queue:
      vars:
        queue_ports:
          - "8123:8123"
        queue_state_dir: /var/lib/maccoys
        queue_volumes:
          - /var/lib/maccoys:/var/lib/maccoys
      hosts:

    # Indexing hosts
    indexing:
      vars:
        indexing_volumes:
          - <FOLDER_FOR_SEARCH_RESULTS>:/searches
      hosts:

    # Processing hosts: search space generation, identification & scoring grouped on one
    # worker so idle capacity in one stage's task pool can be used by another when queue
    # sizes are uneven.
    processing:
      hosts:

    # Finalization hosts: publication & error handling grouped on one worker
    finalization:
      vars:
        finalization_volumes:
          - <FOLDER_FOR_SEARCH_RESULTS>:/searches
      hosts:

    # Web API for MaCcoyS
    entrypoint:
      vars:
        entrypoint_volumes:
          - <FOLDER_FOR_SEARCH_RESULTS>:/searches
        entrypoint_ports:
          - "<PORT_YOU_LIKE>:8000"
      hosts:
