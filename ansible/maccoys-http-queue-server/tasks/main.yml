---

- name: Queue state directory
  ansible.builtin.file:
    path: "{{ hostvars[ (groups['queue']|first) ]['queue_state_dir'] }}"
    state: directory
    owner: "{{ hostvars[inventory_hostname]['maccoys_docker_user']['uid'] }}"
    group: "{{ hostvars[inventory_hostname]['maccoys_docker_user']['gid'] }}"
    mode: '755'



# tasks file for maccoys-http-queue-server
- name: Run MaCcoyS HTTP Queue Server
  ansible.builtin.include_role:
    name: maccoys
  vars:
    maccoys_id: queue-server
    maccoys_cmd: queue-server
    maccoys_opts: "{{ hostvars[ (groups['queue']|first) ]['queue_state_dir'] }} 0.0.0.0 8123"
    prometheus_scraping_port: 9497
