[package]
name = "maccoys"
version = "0.1.0"
authors = ["Dirk Winkelhardt <dirk.winkelhardt@rub.de>"]
edition = "2021"
description = "Mass spectrometry search engine using MaCPepDB as search space."
repository = "https://github.com/medbioinf/maccoys"
homepage = "https://github.com/medbioinf/maccoys"
documentation = "https://github.com/medbioinf/maccoys"
license-file = "../LICENSE"
readme = "README.md"

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
async-stream = { workspace = true }
axum = { workspace = true, features = ["multipart", "original-uri", "http2"] }
clap = { workspace = true, features = ["derive"] }
csv = { workspace = true }
deadqueue = { workspace = true, features = ["limited"] }
dihardts_omicstools = "~3.1.0"
fancy-regex = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
lazy_static = { workspace = true }
local-outlier-probabilities = { workspace = true }
maccoys-exchange-entities = { workspace = true }
macpepdb = { workspace = true }
macpepdb_tui = { workspace = true }
macpepdb_web_common = { workspace = true }
memchr = { workspace = true }
metrics = { workspace = true }
mimalloc = { workspace = true, optional = true }
mini-moka = { workspace = true }
murmur3 = { workspace = true }
ndarray = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
parquet = { workspace = true, features = ["zstd"] }
pastey = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
rand = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, features = [
    "blocking",
    "json",
    "stream",
    "multipart",
    "http2",
] }
rustis = { workspace = true, features = ["tokio-runtime"] }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
tcmalloc2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }
tokio-postgres = { workspace = true, features = ["array-impls"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
xcorrrs = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tracing-test = { workspace = true }


[features]
default = ["mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
tcmalloc = ["dep:tcmalloc2"]
tokio-console = ["macpepdb/tokio-console"]
