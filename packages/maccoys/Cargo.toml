[package]
name = "maccoys"
version = "0.1.0"
authors = ["Dirk Winkelhardt <dirk.winkelhardt@rub.de>"]
edition = "2021"
description = "Mass spectrometry search engine using MaCPepDB as search space."
repository = "https://github.com/medbioinf/maccoys"
homepage = "https://github.com/medbioinf/maccoys"
documentation = "https://github.com/medbioinf/maccoys"
license-file = "../LICENSE"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "maccoys"
path = "src/lib.rs"

[[bin]]
name = "maccoys"
path = "src/bin.rs"

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
async-stream = { workspace = true }
axum = { workspace = true, features = ["multipart", "original-uri", "http2"] }
clap = { workspace = true, features = ["derive"] }
csv = { workspace = true }
deadqueue = { workspace = true, features = ["limited"] }
dihardts_omicstools = "~3.1.0"
fancy-regex = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
indicatif = { workspace = true }
lazy_static = { workspace = true }
local-outlier-probabilities = { workspace = true }
maccoys-exchange-entities = { workspace = true }
macpepdb = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, features = [
    "http-listener",
] }
mini-moka = { workspace = true }
murmur3 = { workspace = true }
ndarray = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
paste = { workspace = true }
polars = { workspace = true, features = [
    "abs",
    "csv",
    "cum_agg",
    "json",
    "lazy",
    "ndarray",
    "parquet",
    "strings",
    "serde",
] }
postcard = { workspace = true, features = ["alloc"] }
rand = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, features = [

    "blocking",
    "json",
    "stream",
    "multipart",
    "http2"
] }
rustis = { workspace = true, features = ["tokio-runtime"] }
scylla = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-loki = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
xcorrrs = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tracing-test = { workspace = true }
