[workspace]
resolver = "3"
members = [
    "packages/exchange",
    "packages/frontend",
    "packages/maccoys",
]

[workspace.dependencies]
anyhow = "1.0.89"
async-stream = "0.3.5"
axum = "0.7.4"
chrono = "0.4"
clap = "4.4.6"
console-subscriber = "0.5.0"
csv = "1.3.0"
deadqueue = "0.2.4"
dihardts_omicstools = "~3.1.0"
dioxus = "0.7.9"
dioxus-logger = "0.7.9"
dioxus-free-icons = "0.10"
fancy-regex = "0.11.0"
flate2 = "1.1.5"
futures = "0.3.28"
glob = "0.3.1"
http = "1.1.0"
indicatif = "0.17.7"
itertools = "0.13.0"
lazy_static = "1.4.0"
local-outlier-probabilities = { git = "https://github.com/medbioinf/loop-rs", branch = "feature-parallelism" }
macpepdb = { path = "../macpepdb/packages/macpepdb" }
macpepdb_metrics_peek = { path = "../macpepdb/packages/metrics-peek" }
macpepdb_tui = { path = "../macpepdb/packages/tui" }
macpepdb_web_common = { path = "../macpepdb/packages/web-common" }
memchr = "2.8.0"
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
mini-moka = "0.10.3"
murmur3 = "0.5.2"
ndarray = "0.16.1"
parking_lot = "0.12.5"
paste = "1.0.15"
plotly = "0.14.1"
polars = { version = "0.46.0", default-features = false }
postcard = "1.1.3"
rand = "0.8.5"
rayon = "1.11.0"
reqwest = "0.12.8"
rustis = "0.13.3"
scylla = "0.8.1"
serde = "1.0.219"
serde_json = "1.0.143"
serial_test = "3.2.0"
signal-hook = "0.3.17"
thiserror = "2.0.12"
tokio = "1.44.2"
tokio-postgres = "~0.7.12"
tokio-util = "0.7.11"
toml = "0.8.19"
tower-http = "0.5.0"
tracing = "0.1.39"
tracing-appender = "0.2.3"
tracing-indicatif = "0.3.5"
tracing-loki = "0.2.6"
tracing-subscriber = "0.3.17"
tracing-test = "0.2.5"
url = "2.5.7"
urlencoding = "2.1.3"
uuid = "1.23.1"
web-sys = "0.3.77"
xcorrrs = "1.2.0"
xxhash-rust = "0.8.15"

# workspace
maccoys = { path = "packages/maccoys" }
maccoys-frontend = { path = "packages/frontend" }
maccoys-exchange-entities = { path = "packages/exchange" }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
